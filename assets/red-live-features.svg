<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520"><rect width="1280" height="520" rx="32" fill="#090b13"/><text x="70" y="90" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="800">Built for face-to-face AI</text><text x="70" y="132" fill="#aaa7b7" font-family="Arial,sans-serif" font-size="22">A compact view of what RED LIVE brings together.</text><g font-family="Arial,sans-serif"><g transform="translate(70 190)"><rect width="340" height="240" rx="24" fill="#151827" stroke="#ff4f9a" stroke-opacity=".35"/><text x="30" y="62" fill="#ff6da9" font-size="34">01</text><text x="30" y="112" fill="#fff" font-size="26" font-weight="700">Live avatars</text><text x="30" y="154" fill="#aaa7b7" font-size="18">Real-time video presence</text><text x="30" y="182" fill="#aaa7b7" font-size="18">with natural movement.</text></g><g transform="translate(470 190)"><rect width="340" height="240" rx="24" fill="#151827" stroke="#6d4aff" stroke-opacity=".4"/><text x="30" y="62" fill="#947cff" font-size="34">02</text><text x="30" y="112" fill="#fff" font-size="26" font-weight="700">Voice + memory</text><text x="30" y="154" fill="#aaa7b7" font-size="18">Hands-free conversation,</text><text x="30" y="182" fill="#aaa7b7" font-size="18">interruptions and context.</text></g><g transform="translate(870 190)"><rect width="340" height="240" rx="24" fill="#151827" stroke="#35d7a4" stroke-opacity=".4"/><text x="30" y="62" fill="#35d7a4" font-size="34">03</text><text x="30" y="112" fill="#fff" font-size="26" font-weight="700">Live web tools</text><text x="30" y="154" fill="#aaa7b7" font-size="18">Give the avatar current</text><text x="30" y="182" fill="#aaa7b7" font-size="18">information when needed.</text></g></g></svg>