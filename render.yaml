services:
  - type: web
    name: red-live
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.3"
      - key: REALTIME_AVATAR_API_KEY
        sync: false
      - key: RED_LIVE_FISH_VOICE_ID
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_AVATAR_ID
        sync: false
      - key: HEYGEN_API_URL
        value: https://api.liveavatar.com
      - key: HEYGEN_IS_SANDBOX
        value: "false"
      - key: ALLOW_PAID_LIVE_SESSIONS
        value: "false"
